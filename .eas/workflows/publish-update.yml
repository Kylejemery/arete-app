# Publishes an EAS Update to the production channel from Expo's servers.
#
# Why this exists: the app's runtimeVersion uses the fingerprint policy, and
# the fingerprint computed on a Windows checkout does not match the one EAS
# computes when it builds, so updates published from a laptop can land on a
# runtime no build has. Running the publish here guarantees the same
# fingerprint the build got.
#
# Run it with:  eas workflow:run publish-update.yml
# or from the EAS dashboard (Workflows), picking the git ref to publish.
name: Publish update

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: false
        description: 'What changed, as shown in the EAS dashboard'
        default: 'Update'

jobs:
  update:
    name: Publish to production
    type: update
    params:
      channel: production
      message: ${{ inputs.message || 'Update' }}
