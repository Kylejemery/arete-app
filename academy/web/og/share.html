<!DOCTYPE html>
<!-- Source for src/app/opengraph-image.png and src/app/twitter-image.png, the
     1200x630 link preview for academy.pursuearete.com. Re-render after editing
     (command in og/README.md). Arete design system, academy scope: navy,
     one gold accent, Playfair Display, near-square corners, no dashes. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@500;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a1628; --card: #111d30; --border: #1e3258; --gold: #c9a84c;
    --gold-13: rgba(201,168,76,0.13); --text: #f5edd6; --text-body: #e8d9b0; --muted: #7a8fa6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, system-ui, sans-serif; color: var(--text-body); -webkit-font-smoothing: antialiased; }
  .frame { position: absolute; inset: 32px; border: 1px solid var(--gold-13); padding: 44px 60px 40px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { font-size: 20px; font-weight: 800; letter-spacing: 6px; color: var(--gold); }
  .greek { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 30px; color: var(--muted); }
  h1 { margin-top: 50px; font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: 78px; line-height: 1.08; color: var(--text); max-width: 980px; }
  h1 em { font-style: italic; background: linear-gradient(135deg, #c9a84c, #e8c96a 50%, #c9a84c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rule { width: 72px; height: 1px; background: rgba(201,168,76,0.4); margin: 28px 0 22px; }
  .sub { font-family: "Cormorant Garamond", Georgia, serif; font-size: 31px; line-height: 1.3; max-width: 960px; }
  .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
  .codes { display: flex; align-items: center; gap: 8px; }
  .code { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 1.5px; color: var(--gold); background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 8px 12px; }
  .free { margin-left: 10px; font-size: 16px; font-weight: 500; color: var(--muted); }
  .url { font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wordmark">ARETE ACADEMY</div>
      <div class="greek">σχολή</div>
    </div>
    <h1>A complete formation in <em>Stoic</em> philosophy.</h1>
    <div class="rule"></div>
    <p class="sub">Seminars in the primary texts with a Socratic proctor, Ancient Greek and Latin, and Stoic logic.</p>
    <div class="bottom">
      <div class="codes">
        <span class="code">PHIL 701</span><span class="code">GREK 101</span><span class="code">LATN 101</span>
        <span class="free">Begin free with PHIL 701</span>
      </div>
      <div class="url">academy.pursuearete.com</div>
    </div>
  </div>
</body>
</html>
