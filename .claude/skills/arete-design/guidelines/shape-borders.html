<!-- @dsCard group="Shape" name="Border system" viewport="700x130" subtitle="1px hairline, 2px selected, 3px gold accent rule. No shadows anywhere." -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="row">
<div style="width:190px;height:62px;background:var(--surface);border:1px solid var(--gold-13);border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--muted)">1px hairline 13%</div>
<div style="width:190px;height:62px;background:var(--surface);border:2px solid var(--gold);border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--gold)">2px selected</div>
<div style="width:190px;height:62px;background:var(--surface);border-left:3px solid var(--gold);border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--text-quote);font-style:italic">3px accent rule</div>
</div></body></html>
