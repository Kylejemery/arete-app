<!-- @dsCard group="Type" name="Editorial serifs" viewport="700x220" subtitle="Cormorant Garamond for web and Library, Playfair Display for the Academy" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Serifs</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="col" style="gap:14px">
<div><div style="font-family:var(--font-serif);font-size:32px;color:#e6eef8;line-height:1.1">The Cabinet, replayed</div><div class="mono">Cormorant Garamond 32 — web app, Library</div></div>
<div><div style="font-family:var(--font-serif-academy);font-size:30px;color:#f5edd6;line-height:1.15">Read the way the Greeks argued</div><div class="mono">Playfair Display 30 — Academy</div></div>
<div><div style="font-family:var(--font-mono);font-size:13px;color:var(--text-body)">JetBrains Mono 13 — code, small labels</div></div>
</div></body></html>
