<!-- @dsCard group="Colors" name="Counselor categories" viewport="700x130" subtitle="Six tinted badges at 20% alpha with pastel text" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Categories</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.b{padding:4px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:600}</style></head><body>
<div class="row">
<span class="b" style="background:rgba(201,168,76,.2);color:#c9a84c">stoics</span><span class="b" style="background:rgba(239,68,68,.2);color:#fca5a5">warriors</span><span class="b" style="background:rgba(59,130,246,.2);color:#93c5fd">athletes</span><span class="b" style="background:rgba(34,197,94,.2);color:#86efac">builders</span><span class="b" style="background:rgba(168,85,247,.2);color:#d8b4fe">writers</span><span class="b" style="background:rgba(99,102,241,.2);color:#a5b4fc">spiritual</span>
</div>
<div class="row" style="margin-top:14px">
<span class="mono">challenge levels, 15% alpha</span>
<span class="b" style="background:rgba(239,68,68,.15);color:#f87171">direct</span><span class="b" style="background:rgba(234,179,8,.15);color:#fde047">firm</span><span class="b" style="background:rgba(34,197,94,.15);color:#86efac">gentle</span>
</div></body></html>
