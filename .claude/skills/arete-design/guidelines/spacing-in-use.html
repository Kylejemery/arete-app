<!-- @dsCard group="Spacing" name="Spacing in use" viewport="700x200" subtitle="25px screen padding, 14-20px card padding, 12px stack gap" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing in use</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body>
<div style="width:300px;border:1px dashed var(--gold-27);border-radius:var(--r-panel);padding:25px">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="background:var(--surface);border:1px solid var(--gold-20);border-radius:var(--r-card-lg);padding:16px;font-size:13px;color:var(--muted)">card, 16 padding</div>
<div style="background:var(--surface);border:1px solid var(--gold-20);border-radius:var(--r-card-lg);padding:20px;font-size:13px;color:var(--muted)">quote card, 20 padding</div>
</div></div>
<div class="mono" style="margin-top:8px">dashed edge = 25px screen padding · gap 12</div>
</body></html>
