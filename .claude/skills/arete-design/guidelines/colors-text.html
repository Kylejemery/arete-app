<!-- @dsCard group="Colors" name="Text ink" viewport="700x170" subtitle="White, body grey, warm off-white for anything a counselor says" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Text</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="col" style="gap:7px">
<div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#ffffff"></span><span style="font-size:13px;color:#ffffff;width:70px">Primary</span><span class="mono">--text #ffffff</span></div><div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#e0e0e0"></span><span style="font-size:13px;color:#e0e0e0;width:70px">Body</span><span class="mono">--text-body #e0e0e0</span></div><div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#e0d5b5"></span><span style="font-size:13px;color:#e0d5b5;width:70px">Warm</span><span class="mono">--text-warm #e0d5b5</span></div><div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#e8e0d0"></span><span style="font-size:13px;color:#e8e0d0;width:70px">Quote</span><span class="mono">--text-quote #e8e0d0</span></div><div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#888888"></span><span style="font-size:13px;color:#888888;width:70px">Muted</span><span class="mono">--muted #888888</span></div><div class="row" style="gap:10px"><span style="width:16px;height:16px;border-radius:4px;background:#555555"></span><span style="font-size:13px;color:#555555;width:70px">Faint</span><span class="mono">--faint #555555</span></div>
</div></body></html>
