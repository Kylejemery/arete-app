<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Icon wells</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.w{border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold)}svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px}</style></head><body>
<div class="row" style="gap:16px">
<div class="w" style="width:38px;height:38px;background:var(--gold-08);border:1px solid var(--gold-20)"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h6M7 13h6"/></svg></div>
<div class="w" style="width:40px;height:40px;background:var(--gold-08);border:1px solid var(--gold-20)"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg></div>
<div class="w" style="width:44px;height:44px;background:var(--gold-15);border:1px solid var(--gold-30)"><svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zM9 4h3v16H9zM14 5l3-1 4 15-3 1z"/></svg></div>
<div class="w" style="width:48px;height:48px;background:var(--gold-15);border:1px solid var(--gold-30);font-size:16px;font-weight:700">M</div>
<span class="mono">38 soft · 40 soft · 44 strong · 48 initial</span>
</div></body></html>
