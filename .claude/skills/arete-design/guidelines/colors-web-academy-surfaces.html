<!-- @dsCard group="Colors" name="Web and academy surfaces" viewport="700x170" subtitle="Two sibling surface sets; gold is identical in all three" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Web and academy surfaces</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body>
<div class="lbl">.web</div>
<div class="row" style="margin:6px 0 12px"><div class="sw"><i style="background:#0f1724"></i><div><b>Background</b><span>#0f1724</span></div></div><div class="sw"><i style="background:rgba(255,255,255,0.04)"></i><div><b>Glass</b><span>4% white</span></div></div><div class="sw"><i style="background:#161f2e"></i><div><b>Surface solid</b><span>#161f2e</span></div></div></div>
<div class="lbl">.academy</div>
<div class="row" style="margin-top:6px"><div class="sw"><i style="background:#0a1628"></i><div><b>Background</b><span>#0a1628</span></div></div><div class="sw"><i style="background:#0f1e38"></i><div><b>Surface</b><span>#0f1e38</span></div></div><div class="sw"><i style="background:#111d30"></i><div><b>Card</b><span>#111d30</span></div></div><div class="sw"><i style="background:#1e3258"></i><div><b>Border</b><span>#1e3258</span></div></div></div>
</body></html>
