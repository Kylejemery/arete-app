<!-- @dsCard group="Brand" name="Overlays and scrims" viewport="700x150" subtitle="55% to 75% black; sheets rise on surface with an 18px top radius" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Overlays</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="row">
<div class="sw"><i style="background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"></i><div><b>Scrim</b><span>55% black</span></div></div><div class="sw"><i style="background:rgba(0,0,0,.65);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"></i><div><b>Sheet scrim</b><span>65% black</span></div></div><div class="sw"><i style="background:rgba(0,0,0,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"></i><div><b>Deep</b><span>75% black</span></div></div>
<div style="width:170px;background:rgba(0,0,0,.65);border-radius:12px;padding-top:22px"><div style="background:var(--surface);border-radius:18px 18px 0 0;padding:14px;font-size:12px;color:var(--gold);font-weight:700">Sheet title</div></div>
</div></body></html>
