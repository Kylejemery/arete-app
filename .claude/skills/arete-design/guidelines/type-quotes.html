<!-- @dsCard group="Type" name="Quotations" viewport="700x150" subtitle="Italic 14/22 warm off-white, 3px gold rule, gold attribution" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quotes</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body>
<div style="max-width:420px;background:var(--surface);border:1px solid var(--gold-13);border-left:3px solid var(--gold);border-radius:var(--r-card-lg);padding:20px;display:flex;gap:12px">
<div style="font-size:44px;line-height:44px;color:var(--gold);font-weight:700;margin-top:-4px">&ldquo;</div>
<div><div style="font-size:14px;font-style:italic;line-height:22px;color:var(--text-quote)">The impediment to action advances action. What stands in the way becomes the way.</div>
<div style="font-size:12px;font-weight:600;color:var(--gold);margin-top:8px">Marcus Aurelius</div></div></div>
</body></html>
