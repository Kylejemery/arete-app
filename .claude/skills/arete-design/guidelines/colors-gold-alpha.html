<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gold alpha</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.a{width:60px}.a>i{height:44px}</style></head><body>
<div class="row" style="gap:8px">
<div class="sw a"><i style="background:rgba(201,168,76,0.05);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>5%</b><span>--gold-05</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.09);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>9%</b><span>--gold-09</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.13);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>13%</b><span>--gold-13</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.15);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>15%</b><span>--gold-15</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.2);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>20%</b><span>--gold-20</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.27);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>27%</b><span>--gold-27</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.33);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>33%</b><span>--gold-33</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.4);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>40%</b><span>--gold-40</span></div></div><div class="sw a"><i style="background:rgba(201,168,76,0.53);border-bottom:1px solid rgba(201,168,76,.13)"></i><div><b>53%</b><span>--gold-53</span></div></div>
</div>
<div class="row" style="margin-top:12px;gap:10px">
<span style="font-size:11px;color:var(--muted)">13% hairline · 20% card border · 27% dashed · 33% emphasis · 53% secondary button border</span>
</div></body></html>
