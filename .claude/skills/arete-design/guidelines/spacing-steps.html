<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="row" style="align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:8px;height:8px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">4</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">8</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">10</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">12</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">16</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">20</div></div><div style="text-align:center"><div style="width:50px;height:50px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">25</div></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--gold-20);border:1px solid var(--gold-40);border-radius:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:5px">28</div></div>
</div></body></html>
