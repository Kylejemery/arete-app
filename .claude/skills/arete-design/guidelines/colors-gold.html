<!-- @dsCard group="Colors" name="Gold" viewport="700x150" subtitle="The single accent: #c9a84c, with its light and deep variants" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gold</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="row">
<div class="sw"><i style="background:#c9a84c"></i><div><b>Gold</b><span>#c9a84c</span></div></div><div class="sw"><i style="background:#e3c77a"></i><div><b>Gold light</b><span>#e3c77a</span></div></div><div class="sw"><i style="background:#9a7a32"></i><div><b>Gold deep</b><span>#9a7a32</span></div></div><div class="sw"><i style="background:linear-gradient(135deg,#c9a84c,#e8c96a 50%,#c9a84c)"></i><div><b>Text gradient</b><span>--gold-grad</span></div></div>
</div></body></html>
