<!-- @dsCard group="Type" name="Kickers and eyebrows" viewport="700x150" subtitle="The signature detail: 10-11px bold uppercase gold, tracked 1.2-3px" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kickers</title><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.sw{width:104px;border-radius:var(--r-card);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sw>i{display:block;height:52px}.sw>div{padding:7px 9px;background:var(--surface-deep)}
.sw b{display:block;font-size:11px;color:var(--text-body);font-weight:600}.sw span{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
</style></head><body><div class="col" style="gap:12px">
<div style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gold)">Today's question <span class="mono" style="letter-spacing:0">10 / 1.2</span></div>
<div style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gold-53)">Prompt <span class="mono" style="letter-spacing:0">dim, 53% gold</span></div>
<div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--gold)">Arete Premium <span class="mono" style="letter-spacing:0">11 / 3</span></div>
<div style="font-size:11px;color:var(--gold-60);font-variant:small-caps;letter-spacing:.5px">Marcus · Seneca · Epictetus <span class="mono">small caps roster</span></div>
</div></body></html>
