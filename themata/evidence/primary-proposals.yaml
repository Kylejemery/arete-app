- id: S016
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Outlines of Pyrrhonism II 146-147 (tr. R. G. Bury, Loeb 1933, with the facing Greek); Sextus Empiricus, Against the Logicians II (M VIII) 431 (tr. R. G. Bury, Loeb 1935)"
  research_ref:
    - {source_id: 937d0561-1290-422a-a887-81a8678dbfcc, locator: "PH II 147"}
    - {source_id: 937d0561-1290-422a-a887-81a8678dbfcc, locator: "PH II 147, Greek (p. 244)"}
    - {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 431"}
  passages:
    - ref: 0
      text: |
        And it is a case of redundancy when we find a premiss that is
        superfluous for the logic of the argument, as for instance “If it is
        day, it is light; but in fact it is day and Dion also is walking;
        therefore it is light.”
    - ref: 1
      text: |
        παρὰ δὲ παρολκὴν ὅταν εὑρίσκηται λῆμμα παρέλκον πρὸς τὴν τοῦ λόγου
        συναγωγήν, οἷον “εἰ ἡμέρα ἔστι, φῶς ἔστιν· ἀλλὰ μὴν ἡμέρα ἔστιν, ἀλλὰ
        καὶ Δίων περιπατεῖ· φῶς ἄρα ἔστιν.”
    - ref: 2
      text: |
        And the argument is indefinite through redundancy when something is
        included, extrinsically and superfluously, along with the premisses, as
        is the case with one like this—“If it is day, it is light; but in fact
        it is day, and also virtue benefits; therefore it is light”
  notes: |
    An ancient example, not a generic instantiation, and the verdict (invalid)
    is Sextus's report of Stoic doctrine. Correction (2026-10-05): the earlier
    note here said PH II gives the superfluous item as a separate premise. That
    came from Mates's translation, which prints "It is day. Dion is walking."
    Bury's English gives a conjunct minor premiss ("it is day and Dion also is
    walking"), the same shape as M VIII 431 ("it is day, and also virtue
    benefits"). The Greek, ἀλλὰ μὴν ἡμέρα ἔστιν, ἀλλὰ καὶ Δίων περιπατεῖ, can be
    read either way, and the definition just before it calls the superfluous
    item a λῆμμα παρέλκον, a superfluous premiss. Both are quoted. How to encode
    it (premise list or conjunct; the Redundancy parameter, F1) is the S016
    question Kyle parked until after his sign-offs; nothing is decided here.
  confidence: high

