  passages:
    - ref: 0
      text: |
        An argument is unsound by deficiency if something is lacking that is
        needed for inferring the conclusion. For example, while the following
        argument is sound, as they suppose: Wealth is good or bad or
        indifferent.
    - ref: 0
      text: |
        this argument is defective by deficiency: Wealth is good or bad. It is
        not bad. Therefore, it is good.
    - ref: 1
      text: |
        And the argument becomes indefinite through deficiency when one of its
        deductive premisses is deficient. For example, “Either wealth is an evil
        or wealth is a good; but wealth is not an evil; therefore wealth is a
        good”; for in the disjunctive premiss there is an omission of “wealth is
        indifferent,”
  notes: |
    Both witnesses make the defect a missing disjunct ("indifferent"), which
    supports the non_formal flag already on this entry. M VIII 434 is on
    p. 465, proofread against the scan on 2026-09-30.
