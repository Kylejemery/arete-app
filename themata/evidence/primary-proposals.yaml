- id: S012
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Against the Logicians II (M VIII) 229-233 (tr. R.G. Bury, 1935)"
  research_ref: {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 232"}
  passage: |
    Since, then, we have two premisses,—the major “If it is day, it is light,”
    which begins with the simple proposition “it is day” but ends with the
    not-simple major “if it is day, it is light,” and also its antecedent “it is
    day,”—from these we shall infer, by the first non-demonstrable, the
    consequent of that major, namely “Therefore if it is day, it is light.”
  notes: |
    Proofread page (p. 359). The analysis fits the schema "if p, (if p, q); p;
    therefore q": a major that begins with "it is day" and ends in the
    conditional "if it is day, it is light". The example itself at § 230 is
    printed, in Bekker's Greek and in Bury's English alike, as a plain first
    indemonstrable ("If it is day, it is light; but in fact it is day; therefore
    it is light"), which does not have that shape. Quote § 232, not § 230, and
    record the discrepancy for the specialist review.
  confidence: medium

- id: S013
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Against the Logicians II (M VIII) 234-236 (tr. R.G. Bury, 1935)"
  research_ref: {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 235-236"}
  passage: |
    For an argument like this is compounded of the second non-demonstrable and
    the third, as one may learn from its analysis; and this will become clearer
    when we have given instruction as to its “scheme,” which goes thus: “If the
    first and the second, the third ⟨is true⟩; but the third is not ⟨true⟩,
    whereas the first is; therefore the second is not ⟨true⟩.”
  notes: |
    Proofread page (p. 361). § 236 gives the analysis: a second indemonstrable
    yields "the first and the second are not ⟨true⟩", and with the remaining
    premiss a third indemonstrable yields "the second is not ⟨true⟩". The
    worked instance is Aenesidemus's argument about signs (§ 234). Premiss
    order in the scheme is major, not-third, first, which matches the schema.
  confidence: high

- id: S014
  replaces: "Alexander of Aphrodisias and Sextus Empiricus, as reported in Zeller, ch. V text and n.245"
  source: "Sextus Empiricus, Outlines of Pyrrhonism II 159, 167 (tr. B. Mates, 1996); Against the Logicians II (M VIII) 443 (tr. R.G. Bury, 1935)"
  research_ref:
    - {source_id: f18c0230-bc6e-44be-865e-04e61e22de55, locator: "PH II 167"}
    - {source_id: f18c0230-bc6e-44be-865e-04e61e22de55, locator: "PH II 159"}
    - {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 443"}
  passages:
    - ref: 0
      text: |
        And if some people disapprove single-premised arguments, they are no
        more worthy of credence than Antipater, who does not reject such
        arguments.
    - ref: 1
      text: |
        then in saying "It is day" we imply "It is light," so that this argument
        will suffice: It is day. Therefore, it is light; and the conditional "If
        it is day, it is light" will be superfluous.
    - ref: 2
      text: |
        For to say that Chrysippus does not approve of arguments having but one
        premiss—which some, perhaps, will say in reply to this objection—is
        utterly non-
    - ref: 2
      text: |
        for Antipater, one of the most eminent men in the Stoic school, asserted
        that arguments with a single premiss can be constructed.
  notes: |
    Sextus gives both sides of the dispute: Chrysippus did not accept
    single-premised arguments, Antipater did. The example "It is day; therefore
    it is light" is Sextus's own reduction of the first indemonstrable (PH II
    159; also M VIII 440-441, proofread p. 469). The second M VIII quotation is
    on p. 471, proofread against the scan on 2026-09-30. S014 now also covers
    the former S015.
  confidence: high

