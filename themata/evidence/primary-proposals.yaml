# Zeller). Not read by the harness.
#
# S011, S012, S013, S014, S016 and S017 moved into suite.yaml on 2026-10-06
# (Kyle), with their sources, quotations and notes; S015 was merged into S014
# earlier. What remains here is T04, which belongs to rules.yaml.
#
# Each proposal cites research_sources (guardrail 1, amended 2026-09-28). Both
# Bury volumes are licence 'quotation_only' (migration 20261005184546): each
# quotation is at most 60 words and is checked whole, with its entry's `source`
# line as the attribution (author, work, translator and edition year must all
# be named there) and the ref's locator. Check with
#   python3 scripts/themata/verify_ledger.py themata/evidence/primary-proposals.yaml
# then carry a proposal into suite.yaml for Kyle's sign-off.
#
# Every passage below is an exact substring (whitespace collapsed) of the text
# stored under its source_id. Ellipses mark text left out. Bracketed note
# markers ([a], [c]) and section markers are kept as stored.
#
# Sources:
#   937d0561-1290-422a-a887-81a8678dbfcc  Sextus, Outlines of Pyrrhonism II, tr. Bury (Loeb 1933)
#     pp. 245, 247, 249, 253, 255, 259 and the Greek of PH II 146-147 (p. 244)
#     proofread against the scan. Replaces Mates (1996) as the PH witness
#     (Kyle, 2026-10-02); no proposal cites Mates now.
#   4543eb65-0f06-4015-ad10-c0842f31fecc  Alexander, in APr. I, ed. Wallies, CAG II.1 (1883), Greek
#     17.10-25, 18.1-20, 283.12-24, 284.10-18, transcribed from the page images
#     with the bearing apparatus; public_domain. Locators are page.line.
#   36848d34-d68e-4ad4-8bbe-04091fd0dc7b  Alexander, in Top., ed. Wallies, CAG II.2 (1891), Greek
#     10.5-14, transcribed from the page image with its apparatus; public_domain.
#   ca2d7557-ef76-49c7-a3d7-bee6c0b78b32  Sextus, Against the Logicians, tr. Bury (Loeb 1935)
#     pp. 353-363, 385-389, 415-419, 463-465, 469-471, 481 proofread against the scan
#     (version 2; version 1, 1349a6e0-dedf-436c-afbb-6fafbc1bfa81, is deprecated).

- id: T04
  file: rules.yaml
  replaces: "Alexander of Aphrodisias, in APr. I.25 (42b5), p. 94b, Greek quoted in Zeller, ch. V n.244"
  source: "Alexander of Aphrodisias, in APr. 283.12-14 and 284.12-15 (ed. Wallies, CAG II.1, 1883)"
  research_ref:
    - {source_id: 4543eb65-0f06-4015-ad10-c0842f31fecc, locator: "in APr. 283.12-14"}
    - {source_id: 4543eb65-0f06-4015-ad10-c0842f31fecc, locator: "in APr. 284.12-15"}
  passages:
    - ref: 0
      text: |
        ἐν τῇ τοιαύτῃ τῶν προτάσεων συνεχείᾳ τό τε συνθετικόν ἐστι θεώρημα,
        περὶ οὗ προειρήκαμεν, καὶ οἱ καλούμενοι ὑπὸ τῶν νεωτέρων ἐπιβάλλοντές
        τε καὶ ἐπιβαλλόμενοι.
    - ref: 1
      text: |
        ὃ οἱ μὲν περὶ Ἀριστοτέλη τῇ χρείᾳ παραμετρήσαντες παρέδοσαν, ἐφ' ὅσον
        αὕτη ἀπῄτει, οἱ δὲ ἀπὸ τῆς Στοᾶς παρ' ἐκείνων λαβόντες καὶ διελόντες
        ἐποίησαν ἐξ αὐτοῦ τὸ καλούμενον παρ' αὐτοῖς δεύτερον θέμα καὶ τρίτον καὶ
        τέταρτον,
  notes: |
    283.12-14 is the passage Zeller quotes (Wallies's margin gives the Aldine
    folio as 94v, not 94a as recorded earlier): in such a chain of premisses
    there is the synthetic theorem and what 'the moderns' call ἐπιβάλλοντες
    and ἐπιβαλλόμενοι. 283.15-17 states the theorem itself.
    284.10-18 (page image checked 2026-10-05; Wallies's index pointed to 284.19,
    but the passage is 284.10-18): the Peripatetics handed down the synthetic
    theorem as far as use required; 'those from the Stoa' took it from them,
    divided it, and made from it what they call the second, third and fourth
    thema, neglecting what is useful and pursuing everything that can be said
    in such a study, even if useless. Zeller's quotation stops before this; it
    is the claim T04's schema states. Apparatus at 284.13: Στοᾶς is B's
    reading, the Aldine has τοῦ; Wallies notes that B confirms Zeller's
    conjecture (III 1 p. 113 n. 1). The attribution to the Stoics therefore
    rests on B.
