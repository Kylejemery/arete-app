- id: S016
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Outlines of Pyrrhonism II 146-147 (tr. B. Mates, 1996); Against the Logicians II (M VIII) 431 (tr. R.G. Bury, 1935)"
  research_ref:
    - {source_id: f18c0230-bc6e-44be-865e-04e61e22de55, locator: "PH II 146-147"}
    - {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 431"}
  passages:
    - ref: 0
      text: |
        It is invalid by redundancy when it contains a premise that is not
        needed for [PH II 147] the validity of the argument, for example: If it is
        day, it is light. It is day. Dion is walking. Therefore, it is light.
    - ref: 1
      text: |
        And the argument is indefinite through redundancy when something is
        included, extrinsically and superfluously, along with the premisses, as
        is the case with one like this—“If it is day, it is light; but in fact
        it is day, and also virtue benefits; therefore it is light”
  notes: |
    Now an ancient example, not a generic instantiation, and the verdict
    (invalid) is Sextus's report of Stoic doctrine, not Mates's doubt about it.
    PH II gives the superfluous item as a separate premise, matching the
    schema. M VIII (proofread p. 463) gives it as a conjunct added to the minor
    premiss ("it is day, and also virtue benefits"). If the harness treats
    premises as a list, the two are different encodings; that may bear on the
    Redundancy parameter (F1). Consider a second entry for the conjunct form.
    The quotation keeps the source's [PH II 147] marker, which falls mid-sentence.
  confidence: high

- id: S017
