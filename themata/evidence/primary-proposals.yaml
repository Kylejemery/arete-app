- id: S012
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Against the Logicians II (M VIII) 229-233 (tr. R. G. Bury, Loeb 1935)"
  research_ref: {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 232"}
  passage: |
    the major “If it is day, it is light,” which begins with the simple
    proposition “it is day” but ends with the not-simple major “if it is day,
    it is light,” and also its antecedent “it is day,”—from these we shall
    infer, by the first non-demonstrable, the consequent of that major, namely
    “Therefore if it is day, it is light.”
  notes: |
    Proofread page (p. 359). The analysis fits the schema "if p, (if p, q); p;
    therefore q": a major that begins with "it is day" and ends in the
    conditional "if it is day, it is light". The example itself at § 230 is
    printed, in Bekker's Greek and in Bury's English alike, as a plain first
    indemonstrable ("If it is day, it is light; but in fact it is day; therefore
    it is light"), which does not have that shape. Quote § 232, not § 230, and
    record the discrepancy for the specialist review. The quotation starts at
    "the major" to stay within 60 words; the words before it are "Since, then,
    we have two premisses,—".
  confidence: medium

- id: S013
  replaces: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  source: "Sextus Empiricus, Against the Logicians II (M VIII) 234-236 (tr. R. G. Bury, Loeb 1935)"
  research_ref: {source_id: ca2d7557-ef76-49c7-a3d7-bee6c0b78b32, locator: "M VIII 235-236"}
  passage: |
    For an argument like this is compounded of the second non-demonstrable and
    the third, … its “scheme,” which goes thus: “If the first and the second,
    the third ⟨is true⟩; but the third is not ⟨true⟩, whereas the first is;
    therefore the second is not ⟨true⟩.”
  notes: |
    Proofread page (p. 361). § 236 gives the analysis: a second indemonstrable
    yields "the first and the second are not ⟨true⟩", and with the remaining
    premiss a third indemonstrable yields "the second is not ⟨true⟩". The
    worked instance is Aenesidemus's argument about signs (§ 234). Premiss
    order in the scheme is major, not-third, first, which matches the schema.
    The ellipsis leaves out "as one may learn from its analysis; and this will
    become clearer when we have given instruction as to" (60-word limit).
  confidence: high

- id: S014
  replaces: "Alexander of Aphrodisias and Sextus Empiricus, as reported in Zeller, ch. V text and n.245"
  source: "Sextus Empiricus, Outlines of Pyrrhonism II 159, 167 (tr. R. G. Bury, Loeb 1933); Sextus Empiricus, Against the Logicians II (M VIII) 443 (tr. R. G. Bury, Loeb 1935); Alexander of Aphrodisias, in APr. 17.18-21 (ed. Wallies, CAG II.1, 1883)"
  research_ref:
