- id: S011
  replaces: "Alexander of Aphrodisias, in APr., as reported in Zeller, ch. V n.239"
  source: "Alexander of Aphrodisias, in Top. 10.7-12 (ed. Wallies, CAG II.2, 1891); Alexander of Aphrodisias, in APr. 18.14-17 (ed. Wallies, CAG II.1, 1883)"
  research_ref:
    - {source_id: 36848d34-d68e-4ad4-8bbe-04091fd0dc7b, locator: "in Top. 10.7-12"}
    - {source_id: 4543eb65-0f06-4015-ad10-c0842f31fecc, locator: "in APr. 18.14-17"}
  passages:
    - ref: 0
      text: |
        οἷοί εἰσι κατὰ τοὺς ἀπὸ τῆς Στοᾶς οἱ διφορούμενοί τε καὶ οἱ
        ἀδιαφόρως περαίνειν ὑπ' αὐτῶν λεγόμενοι. διφορούμενοι μὲν γάρ εἰσι
        κατ' αὐτοὺς οἱ τοιοῦτοι ‘εἰ ἡμέρα ἐστίν, ἡμέρα ἐστίν· ἀλλὰ μὴν ἡμέρα
        ἐστίν· ἡμέρα ἄρα ἐστίν’· ἀδιαφόρως δὲ περαίνοντες ἐν οἷς τὸ
        συμπέρασμα ταὐτόν ἐστιν ἑνὶ τῶν λημμάτων, ὡς ἐπὶ τῶν τοιούτων ‘ἤτοι
        ἡμέρα ἐστὶν ἢ φῶς ἐστιν· ἀλλὰ μὴν ἡμέρα ἐστίν· ἡμέρα ἄρα ἐστίν’.
    - ref: 1
      text: |
        τὸ γὰρ χρειῶδες τοῦ συλλογισμοῦ οὐ παρέχεται τὸ ‘εἰ ἡμέρα ἐστίν, φῶς
        ἐστιν· ἀλλὰ μὴν ἡμέρα ἐστίν· φῶς ἄρα ἐστί’, καὶ ὅλως οἱ λεγόμενοι ὑπὸ
        τῶν νεωτέρων ἀδιαφόρως περαίνοντες.
  witnesses:
    - "Alex. in APr. 20.11 and 164.25-31 (CAG II.1): further mentions (Wallies's index), no disjunctive example; not stored."
  notes: |
    in Top. 10.7-12 (stored 2026-10-06, read against the page image) is the
    witness for S011's schema. Alexander attributes both kinds to 'those from
    the Stoa': the διφορούμενοι ('if it is day, it is day; but it is day;
    therefore it is day') and the ἀδιαφόρως περαίνοντες, 'in which the
    conclusion is the same as one of the premisses', e.g. 'either it is day or
    it is light; but it is day; therefore it is day'. The schema "either p or
    q; p; therefore p" is attested with the disjunct "it is light", not "it is
    night" as in Zeller n.239; the form is the same.
    What the text rests on, from Wallies's apparatus: (1) ἀδιαφόρως (10.8,
    10.10) is Prantl's emendation; every manuscript reads διαφόρως. (2) ἤτοι
    ('either', 10.11) is added in P's margin by a later hand (P3). (3) ἐστὶν ἢ
    ('is, or', 10.12) is corrected in B by B2 from ἐστὶ; A reads ἐστὶν εἰ
    ('is, if'). So the disjunctive example rests on later corrections, and the
    name on an emendation. The attribution to the Stoa (10.7) has no variant.
    in APr. 18.14-17 (CAG II.1) names the same class of 'the moderns', with
    the same emendation question (ἀδιαφόρως a: διαφόρως BLM) and an example
    that, as printed (φῶς, LM), is a plain first indemonstrable; aB read
    ἡμέρα, which makes the conclusion repeat a premiss.
  scans:
    - "CAG II.1: https://archive.org/details/alexandriinaris00berlgoog (also bub_gb_ZMIOAAAAQAAJ)"
    - "CAG II.2: https://archive.org/details/commentariainar01michgoog (title page: 1891)"

- id: T04
  file: rules.yaml
  replaces: "Alexander of Aphrodisias, in APr. I.25 (42b5), p. 94b, Greek quoted in Zeller, ch. V n.244"
  source: "Alexander of Aphrodisias, in APr. 283.12-14 and 284.12-15 (ed. Wallies, CAG II.1, 1883)"
  research_ref:
    - {source_id: 4543eb65-0f06-4015-ad10-c0842f31fecc, locator: "in APr. 283.12-14"}
    - {source_id: 4543eb65-0f06-4015-ad10-c0842f31fecc, locator: "in APr. 284.12-15"}
  passages:
    - ref: 0
      text: |
        ἐν τῇ τοιαύτῃ τῶν προτάσεων συνεχείᾳ τό τε συνθετικόν ἐστι θεώρημα,
        περὶ οὗ προειρήκαμεν, καὶ οἱ καλούμενοι ὑπὸ τῶν νεωτέρων ἐπιβάλλοντές
        τε καὶ ἐπιβαλλόμενοι.
    - ref: 1
      text: |
        ὃ οἱ μὲν περὶ Ἀριστοτέλη τῇ χρείᾳ παραμετρήσαντες παρέδοσαν, ἐφ' ὅσον
        αὕτη ἀπῄτει, οἱ δὲ ἀπὸ τῆς Στοᾶς παρ' ἐκείνων λαβόντες καὶ διελόντες
        ἐποίησαν ἐξ αὐτοῦ τὸ καλούμενον παρ' αὐτοῖς δεύτερον θέμα καὶ τρίτον καὶ
        τέταρτον,
  notes: |
    283.12-14 is the passage Zeller quotes (Wallies's margin gives the Aldine
    folio as 94v, not 94a as recorded earlier): in such a chain of premisses
    there is the synthetic theorem and what 'the moderns' call ἐπιβάλλοντες
    and ἐπιβαλλόμενοι. 283.15-17 states the theorem itself.
    284.10-18 (page image checked 2026-10-05; Wallies's index pointed to 284.19,
    but the passage is 284.10-18): the Peripatetics handed down the synthetic
    theorem as far as use required; 'those from the Stoa' took it from them,
    divided it, and made from it what they call the second, third and fourth
    thema, neglecting what is useful and pursuing everything that can be said
    in such a study, even if useless. Zeller's quotation stops before this; it
    is the claim T04's schema states. Apparatus at 284.13: Στοᾶς is B's
    reading, the Aldine has τοῦ; Wallies notes that B confirms Zeller's
    conjecture (III 1 p. 113 n. 1). The attribution to the Stoics therefore
    rests on B.
