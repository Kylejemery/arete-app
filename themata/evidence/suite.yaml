  verdict: valid
  kind: derived
  source: "Origen, Against Celsus VII.15 (tr. F. Crombie, Ante-Nicene Fathers IV, 1885), reporting the Stoics"
  passage: |
    The concrete example which the Stoics give to illustrate this form of
    argument is the following: 1st, If you know that you are dead, you are
    dead; 2d, if you know that you are dead, you are not dead. And the
    conclusion is—“you do not know that you are dead.”
