- id: S018
  schema: "not (p1 and not p2); not (p2 and not p3); ... ; not (p9 and not p10); p1; therefore p10"
  verdict: valid
  kind: sophism
  source: "Diogenes Laertius, Lives VII 7.82 (tr. R.D. Hicks, 1925)"
  passage: |
    There are also certain insoluble arguments: the Veiled Men, the Concealed,
    Sorites, Horned Folk, the Nobodies. The Veiled is as follows: … “It cannot
    be that if two is few, three is not so likewise, nor that if two or three
    are few, four is not so; and so on up to ten. But two is few, therefore so
    also is ten.”
  corpus_ref: "e624f24d-83d0-4efd-98d3-19457ace3554"
  notes: |
    The Sorites. The " … " is in the chunk text itself (see Kyle's note 4
    below on what it hides).
    Hicks's "It cannot be that if two is few, three is not so likewise" is
    read as "not (two is few and three is not few)", a negated conjunction.
    Each step is then a third indemonstrable followed by removal of a double
    negation, which makes the form a test of the double negation parameter
    (rules.yaml C06).
    Chrysippus's response concerns assent, not form. Cicero, Academica II ch.
    XXIX (chunk dc6299a6-98fb-450b-abd5-e19a5d96a49b): "For Chrysippus’s plan
    is, when he is interrogated step by step (by way of giving an instance),
    whether there are three, or few, or many, to rest a little before he comes
    to the “many;”".
    Ruling (Kyle, 2026-09-27): the chain form is valid, tagged kind: sophism.
    The fault of the Sorites lies in its premises, not its form. Under the
    syntactic reading of "contradictory" (C06), each link is a plain third
    indemonstrable, since the contradictory of "not p2" is "p2". Under the
    negation reading, each link also needs double-negation elimination.
    Kyle's review (2026-10-05):
    (1) The claim is "valid in form, with a false premise".
    (2) DL lists it among the insoluble arguments, and Chrysippus did not
    accept it: he fell silent before the failing step (Cicero, Ac. II.93;
    Sextus, M VII.416).
    (3) The three-atom chain in the encoding stands for the full series up
    to ten.
    (4) In DL 7.82 the text sits under "the Veiled", which is likely a
    lacuna. The excerpt's ellipsis hides this.
  confidence: low
  verified_by_kyle: false

