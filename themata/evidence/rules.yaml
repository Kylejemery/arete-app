  corpus_ref: null
  notes: |
    Rewritten 2026-10-22 from the full text (research_sources 48d67ff4,
    licensed_copy). The entry used to quote the Mode 2 summary (chunk
    76b4b6e1-9e59-478b-8807-457e1a7756b2), which reversed section 5: it said
    the system satisfies reflexivity and monotonicity and fails antilogism.
    The paper says the opposite (pp. 181-182). That summary was deprecated
    and replaced by migration 20261022120126.

    What the paper says, against the project's results:
    - Monotonicity fails "in accordance with the restriction on redundancy"
      (p. 181), so the reconstruction rejects weakening, as every fitting
      candidate here does (FINDINGS 3). The flag this entry used to carry,
      that Bobzien's system is monotonic and so conflicts with S016, rested
      on the summary's error.
    - Contraction is "partly covered" by T2 (p. 182). T2 is a cut in which a
      premiss of the first component argument is used again in the second
      (p. 153; A1, A2 ⊢ A3 and Ai, A3 ⊢ C give A1, A2 ⊢ C). That is the
      work the project's set view and merging cut do. Her own analyses use
      T2 exactly where the harness needs contraction: S011 (indifferently
      concluding, p. 168: A4 and A5 joined by T2), S020 (Origen's two
      conditionals, p. 169: T1 twice and T2 once), and S012-type "infinite
      content" arguments (p. 171: T2 once per nesting). Her S020 analysis
      also uses the first thema, which agrees with FirstThema.lean
      (S020_needs_first_thema).
    - The restriction on contraction: arguments of the form A, A ⊢ B are
      not arguments for her (pp. 175-179), premiss repetition probably fails
      (p. 182), and she suggests doublets were eliminated before the themata
      were applied (n. 96). This is close to the project's set view, which
      collapses doublets, and is a reason to prefer it over the multiset
      view when a Bobzien module is encoded.
    - Her section 5 results hold for any reconstruction in which T2-T4
      together have the deductive power of the synthetic theorem (n. 95),
      which is how the project reads Mates + dialectical theorem.
    - One-premiss arguments: Chrysippus rejected them and Antipater admitted
      them (pp. 171-173, citing Sextus M 8.443 and PH 2.167); she argues
      against Mueller and Mignucci that Chrysippus accepted none. This bears
      on S014 and the single-premise parameter.

    Her T1-T4 (p. 153) and the third thema's two versions (Alexander in APr.
    278 has external premisses deduce a premiss; Simplicius in Cael. 237 has
    one external join the conclusion; pp. 145-151, preferring Simplicius)
    are the basis for a Bobzien candidate module. The Kyle ruling of
    2026-09-27 (no Bobzien module until the paper is in the corpus) is now
    satisfiable: the paper is in research_sources. Encoding it is SCOPE
    milestone 5 and is not done here.
    Sign-off (Kyle, 2026-10-26): signed off as a faithful report of its
    source. Open questions recorded in these notes are left for the
    specialist review (guardrail 5), not settled by this sign-off.
