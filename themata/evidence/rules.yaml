- id: C01
  schema: "Chrysippean conditional: 'if p, q' is true iff the contradictory of q conflicts with p."
  status: attested
  kind: connective
  source: "Diogenes Laertius, Lives VII 7.73 (tr. R.D. Hicks, 1925)"
  passage: |
    A hypothetical proposition is therefore true, if the contradictory of its
    conclusion is incompatible with its premiss, e.g. “If it is day, it is
    light.” This is true. For the statement “It is not light,” contradicting
    the conclusion, is incompatible with the premiss “It is day.” On the other
    hand, a hypothetical proposition is false, if the contradictory of its
    conclusion does not conflict with the premiss, e.g. “If it is day, Dion is
    walking.” For the statement “Dion is not walking” does not conflict with
    the premiss “It is day.”
  corpus_ref: "14f8f3d9-bf33-4ed6-a6ed-ae36b9bfdc6b"
  notes: |
    Hicks translates antecedent and consequent as "premiss" and "conclusion",
    which invites confusion with argument premises. Zeller n.221 (chunk
    05958d2e-5680-46e2-a7aa-bb5c95a250b7) attributes this criterion to
    Chrysippus: "The first of these requirements, which is mentioned by Diog.
    73 as the only criterion of the Stoic School, was due to Chrysippus".
    DL 7.71 (chunk 0188bfdf-30f2-4517-8244-1fa27d5ae588): the conjunction "If"
    "promises that the second of two things follows consequentially upon the
    first".
  confidence: high
  verified_by_kyle: false

- id: C02
  schema: "The truth-conditions of the conditional were disputed: Diodorus, Philo and Chrysippus each held a different view. Philo's: true unless antecedent true and consequent false."
  status: attested
  kind: connective
  source: "Cicero, Academica II (Lucullus) ch. XLVII (tr. C.D. Yonge, 1856); Sextus as quoted in Zeller, ch. V n.221"
  passage: |
    In this very thing, which the dialecticians teach among the elements of
    their art, how one ought to judge whether an argument be true or false
    which is connected in this manner, “If it is day, it shines,” how great a
    contest there is;—Diodorus has one opinion, Philo another, Chrysippus a
    third.
  corpus_ref: "c0a540bf-80c4-4e6e-9c1e-3d968ee41331"
  notes: |
    Zeller n.221 (chunk 524a0d82-8e4b-4147-a8ef-0cfa6cb6d760) quotes Sext.
    Math. viii. 112 in Greek ("κοινῶς μὲν γάρ φασιν ἅπαντες οἱ Διαλεκτικοὶ
    ὑγιὲς εἶναι συνημμένον, ὅταν ἀκολουθῇ τῷ ἐν αὐτῷ ἡγουμένῳ τὸ ἐν αὐτῷ λῆγον.
    περὶ δὲ τοῦ πότε ἀκολουθεῖ καὶ πῶς, στασιάζουσι πρὸς ἀλλήλους") and
    reports Philo's view: "who declared all conditional sentences to be right
    in which a false inferential clause is not drawn from a true leading
    clause. According to this view, conditional sentences would be right,
    with both clauses true, or both false, or with a false leading clause and
    true inferential clause (Sext. l.c. viii. 245 and 449; Pyrrh. ii. 110).
    According to Sext. Pyrrh. ii. 104, the view of Philo appears to have gained
    acceptance among the Stoics". Zeller also reports a containment criterion
    (Sext. Pyrrh. ii. 111). So the corpus attests four readings: Philonian,
    Diodorean, Chrysippean (connexion), and containment.
    Mates's summary (chunk 9b9e26c8-317b-43b4-bf43-834337b0c922) models them as
    material, always-true, strict, and a fourth that "would rule out the
    'duplicated propositions'". That fourth reading would falsify "if p, p"
    and so the major premise of suite S009.
    Parameter values for Params.lean: philonian | diodorean | chrysippean |
    containment.
  confidence: high
  verified_by_kyle: false

- id: C03
  schema: "Chrysippus would restate a conditional that fails his test as a negated conjunction: not 'if p, not q' but 'not (p and q)'."
  status: attested
  kind: connective
  source: "Cicero, De Fato ch. 8 (tr. C.D. Yonge, 1853); Latin quoted in Zeller, ch. V n.221"
  passage: |
    He would rather have them announce the prognostic in this fashion, — "
    It is not the case that if any one is born under the dog-star he will be
    drowned in the sea." What an excel lent joke ! Rather than agree with the
    rational Diodorus, he sets about instructing the Chaldeans how they should
    frame their responses. I ask, then, if the Chaldeans should allow
    themselves to change affirmative indefinites into negative indefinite
    conjunctives
  corpus_ref: "dfd1d864-021a-4b4a-b9b6-71223d8d16fb"
  notes: |
    Yonge's English, as printed in the chunk, reads as a negated conditional
    ("It is not the case that if..."). Cicero's own description in the same
    sentence ("negative indefinite conjunctives") and Zeller's Latin show it
    is a negated conjunction. Zeller n.221 (chunk
    05958d2e-5680-46e2-a7aa-bb5c95a250b7): "it was not right to say, Si quis natus est oriente
    canicula, is in mari non morietur; but, Non et natus est quis oriente
    canicula et is in mari morietur." The OCR spacing ("excel lent") and the
    stray quotation mark are in the chunk.
    This bears on the parameter directly. Under the Chrysippean reading, a
    true negated conjunction does not license the conditional, so third
    indemonstrables and first indemonstrables cannot be interconverted.
    Under the Philonian reading they can.
  confidence: high
  verified_by_kyle: false

- id: C04
  schema: "Disjunction is exclusive: exactly one disjunct is true."
  status: attested
  kind: connective
  source: "Diogenes Laertius, Lives VII 7.72 (tr. R.D. Hicks, 1925); Cicero, Academica II ch. XXX (tr. Yonge)"
  passage: |
    A disjunctive proposition is one which is constituted such by the
    disjunctive conjunction “Either,” as e.g. “Either it is day or it is
    night.” This conjunction guarantees that one or other of the alternatives
    is false.
  corpus_ref: "0188bfdf-30f2-4517-8244-1fa27d5ae588"
  notes: |
    DL gives only "one ... is false", which on its own is weaker than
    exclusivity. The other half (at least one is true) comes from Cicero,
    Academica II ch. XXX (chunk 2ba79887-49fa-4618-8a50-f5c70d5cb00c): "when
    the dialecticians lay it down that every disjunctive proposition, such as
    'either yes or no' is not only true but necessary". Together these give
    exclusive disjunction for the two-disjunct case the indemonstrables use.
    Mates's summary (chunk fcdf4b9c-1f28-4d6b-89a3-936a405e584e) cites Gellius
    for "exactly one disjunct ... true and all others false". Gellius XVI.8 is
    not in the corpus (only XIX.1 is), see gaps.md.
  confidence: high
  verified_by_kyle: false

- id: C05
  schema: "Conjunction: formed by coupling conjunctions; 'It is day-time and it is light'."
  status: attested
  kind: connective
  source: "Diogenes Laertius, Lives VII 7.72 (tr. R.D. Hicks, 1925)"
  passage: |
    A coupled proposition is one which is put together by certain coupling
    conjunctions, e.g. “It is day-time and it is light.”
  corpus_ref: "0188bfdf-30f2-4517-8244-1fa27d5ae588"
  notes: |
    The corpus gives no truth-condition for conjunction. It is not
    needed for the brief, since classical conjunction is uncontested, but
    it should be recorded as an assumption in NOTES.md.
  confidence: high
  verified_by_kyle: false

- id: C06
  schema: "Negation and double negation: 'not not-p' presupposes p."
  status: attested
  kind: connective
  source: "Diogenes Laertius, Lives VII 7.69 (tr. R.D. Hicks, 1925)"
  passage: |
    An example of a negative proposition is “It is not day.” Of the negative
    proposition one species is the double negative. By double negative is
    meant the negation of a negation, e.g. “It is not not-day.” Now this
    presupposes that it is day.
  corpus_ref: "0188bfdf-30f2-4517-8244-1fa27d5ae588"
  notes: |
    The indemonstrables are defined with "contradictory", not "negation"
    (suite S002 to S005). With double negation as a separate proposition, the
    contradictory of "not p" is "p", not "not not p". The corpus also shows
    the Stoics treating "not not p" as a distinct (double negative)
    proposition that "presupposes" p. So whether "not not p" and "p" are
    interchangeable in a derivation is a real parameter, not a detail. Mates's
    summary raises exactly this (chunk 401a8e59-19ef-4e5e-80f0-dbeb990103a0,
    "Double negation assumption") and "declines to settle" it.
    Parameter: contradictory = syntactic toggle (strip or add one "not") |
    negation plus double-negation elimination.
  confidence: high
  verified_by_kyle: false

- id: C07
  schema: "Other non-simple propositions: inferential ('since'), causal ('because'), comparative ('rather than')."
  status: attested
  kind: context
  source: "Diogenes Laertius, Lives VII 7.71–7.74 (tr. R.D. Hicks, 1925)"
  passage: |
    An inferential proposition according to Crinis in his Art of Dialectic is
    one which is introduced by the conjunction “Since” and consists of an
    initial proposition and a conclusion; for example, “Since it is day-time,
    it is light.” This conjunction guarantees both that the second thing
    follows from the first and that the first is really a fact.
  corpus_ref: "0188bfdf-30f2-4517-8244-1fa27d5ae588"
  notes: |
    Out of scope: the five indemonstrables use only the conditional, negated
    conjunction and disjunction. Recorded so that Syntax.lean's choice to omit
    these connectives is a documented decision.
  confidence: high
  verified_by_kyle: false

- id: C08
  schema: "Validity criterion: an argument is conclusive iff the contradictory of the conclusion is incompatible with the conjunction of the premises."
  status: attested
  kind: validity_criterion
  source: "Diogenes Laertius, Lives VII 7.77 (tr. R.D. Hicks, 1925)"
  passage: |
    Inconclusive are such that the contradictory of the conclusion is not
    incompatible with combination of the premisses
  corpus_ref: "f9d254ff-01b0-4b37-b98d-9d71132839a9"
  notes: |
    This is the semantic side. It is the connexion criterion for conditionals
    (C01) applied to the conditional whose antecedent is the conjunction of
    the premises. Mates's summary (chunk f02a4416-3430-4014-bd73-fbdb3ed20170)
    calls it a "conditionalization principle" and notes that the Stoics
    "always stated the principle as a biconditional".
    This criterion gives the harness a possible route to "proven underivable"
    (Phase 4): an argument whose premises are compatible with the
    contradictory of its conclusion under a chosen semantics is invalid on
    this criterion. The criterion alone is monotonic, since adding a premise
    never restores compatibility, so it cannot by itself explain the
    rejection of redundant arguments (suite S016). That gap is itself
    evidence to report.
  confidence: high
  verified_by_kyle: false

