- id: T03
  schema: "Third thema: if from the premises of an argument a conclusion follows, and from that conclusion together with a further premise a third proposition follows, then that third proposition also follows from the original premises together with the further premise."
  status: attested
  kind: thema
  source: "Simplicius, in De Caelo (Schol. in Arist. 483b26), Greek quoted in Zeller, ch. V n.244; English gloss is Zeller's"
  passage: |
    Reference is made to the same thing in Simpl. De Cœlo; Schol. in Arist.
    483, b, 26: ἡ δὲ τοιαύτη ἀνάλυσις τοῦ λόγου, ἡ τὸ συμπέρασμα λαμβάνουσα
    καὶ προσλαμβάνουσα ἄλλην πρότασιν, κατὰ τὸ τρίτον λεγόμενον παρὰ τοῖς
    Στωϊκοῖς θέμα περαίνεται, the rule of which is, that when a third
    proposition can be drawn from the conclusion of an inference and a second
    proposition, that third proposition can be drawn also from the premisses
    of the inference and the second proposition.
  corpus_ref: "6a3cffd7-8e11-4dc9-92b9-9a3863d19713"
  notes: |
    The Greek (Simplicius) says only that an analysis which takes the
    conclusion and adds another premise "is completed according to what the
    Stoics call the third thema". The general statement of the rule after
    "the rule of which is" is Zeller's gloss, not Simplicius. Phase 3 should
    encode the Greek's content and treat Zeller's wording as one
    reconstruction among others.
    Mates's summary (T06) states the third thema almost identically. Structurally
    this is a cut rule, and cut is exactly where redundancy (suite S016) can
    enter: if the further premise is idle, cut can manufacture a redundant
    argument. This is the interaction the harness exists to test.
    Sign-off (Kyle, 2026-10-26): signed off as a faithful report of its
    source. Open questions recorded in these notes are left for the
    specialist review (guardrail 5), not settled by this sign-off.
  confidence: medium
  verified_by_kyle: true
  verified_on: "2026-10-26"

