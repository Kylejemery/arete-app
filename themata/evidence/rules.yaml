# Themata Project, Phase 1: rules and connectives ledger.
#
# suite.yaml holds argument forms, which become the harness's test items.
# This file holds what the brief also asked Phase 1 to collect: every passage
# that states or paraphrases a thema, the synthetic theorem, and the
# definitions of the connectives that Params.lean will have to choose between.
# These are not test items. They are inputs to Phase 2 and Phase 3.
#
# Same fields and conventions as suite.yaml (see its header on retrieval and
# on witness strength), with two changes: `schema` holds the rule or definition
# as stated, and `verdict` is replaced by `status`:
#   attested       stated in an ancient text in the corpus (possibly quoted
#                  in a secondary work)
#   reported       stated only in a modern summary or reconstruction
#   context        bears on the rule without stating it
# `kind` here is one of: thema | synthetic_theorem | dialectical_theorem |
#   connective | validity_criterion | reconstruction | context

# ---------------------------------------------------------------------------
# The themata
# ---------------------------------------------------------------------------

- id: T01
  schema: "An argument is syllogistic iff it is an indemonstrable or is reduced to the indemonstrables by one or more themata."
  status: attested
  kind: thema
  source: "Diogenes Laertius, Lives VII 7.78, Greek quoted in Zeller, ch. V n.241"
  passage: |
    [241] Diog. 78: συλλογιστικοὶ [λόγοι] μὲν οὖν εἰσιν οἱ ἤτοι ἀναπόδεικτοι
    ὄντες ἢ ἀναγόμενοι ἐπὶ τοὺς ἀναποδείκτους κατά τι τῶν θεμάτων ἢ τινά.
    According to Galen, Hipp. et Plat. ii. 3, p. 224, Chrysippus had taken
    great pains in resolving the composite forms of inference (Diog. 190 and
    194). Antipater suggested still simpler modes.
  corpus_ref: "8e7bb081-9d8b-481f-b3ac-57183751efa5"
  notes: |
    This is the only statement in the corpus, in an ancient author's words,
    that the themata are the reduction rules. Hicks's English for the same
    sentence (7.78, chunk f9d254ff-01b0-4b37-b98d-9d71132839a9) drops the
    word: "The syllogistic are such as either do not admit of, or are
    reducible to such as do not admit of, immediate proof in respect of one or
    more of the premisses". "κατά τι τῶν θεμάτων ἢ τινά" (by one or some of
    the themata) becomes "in respect of one or more of the premisses". So the
    word "thema" does not appear in the English of the one primary text the
    corpus holds, which is the vocabulary problem CLAUDE.md describes for the
    concordances.
    Recommendation: a concordance entry for θέμα / θέματα.
  confidence: high
  verified_by_kyle: false

- id: T02
  schema: "There are (at least) a first, second, third and fourth thema."
  status: attested
  kind: thema
  source: "Galen, De placitis Hippocratis et Platonis II.3, and Alexander, in APr., as cited in Zeller, ch. V n.244"
  passage: |
    Or else the πρῶτον, δεύτερον, τρίτον and τέταρτον θέμα mentioned by Galen,
    Hipp. et Plat. ii. 3, vol. v. 224; Alex. Anal. Pr. 53, b, would hardly
    suggest to him the various forms of the ἀναπόδεικτοι instead of the
    formulæ for the resolution of composite conclusions.
  corpus_ref: "6a3cffd7-8e11-4dc9-92b9-9a3863d19713"
  notes: |
    This establishes that there were four numbered themata and that they were
    rules for resolving composite arguments. The sentence is Zeller's, and it
    is directed against Prantl. The Galen and Alexander texts themselves are
    not in the corpus (gaps.md).
  confidence: medium
  verified_by_kyle: false

- id: T03
  schema: "Third thema: if from the premises of an argument a conclusion follows, and from that conclusion together with a further premise a third proposition follows, then that third proposition also follows from the original premises together with the further premise."
  status: attested
  kind: thema
  source: "Simplicius, in De Caelo (Schol. in Arist. 483b26), Greek quoted in Zeller, ch. V n.244; English gloss is Zeller's"
  passage: |
    Reference is made to the same thing in Simpl. De Cœlo; Schol. in Arist.
    483, b, 26: ἡ δὲ τοιαύτη ἀνάλυσις τοῦ λόγου, ἡ τὸ συμπέρασμα λαμβάνουσα
    καὶ προσλαμβάνουσα ἄλλην πρότασιν, κατὰ τὸ τρίτον λεγόμενον παρὰ τοῖς
    Στωϊκοῖς θέμα περαίνεται, the rule of which is, that when a third
    proposition can be drawn from the conclusion of an inference and a second
    proposition, that third proposition can be drawn also from the premisses
    of the inference and the second proposition.
  corpus_ref: "6a3cffd7-8e11-4dc9-92b9-9a3863d19713"
  notes: |
    The Greek (Simplicius) says only that an analysis which takes the
    conclusion and adds another premise "is completed according to what the
    Stoics call the third thema". The general statement of the rule after
    "the rule of which is" is Zeller's gloss, not Simplicius. Phase 3 should
    encode the Greek's content and treat Zeller's wording as one
    reconstruction among others.
    Mates's summary (T06) states the third thema almost identically. Structurally
    this is a cut rule, and cut is exactly where redundancy (suite S016) can
    enter: if the further premise is idle, cut can manufacture a redundant
    argument. This is the interaction the harness exists to test.
  confidence: medium
  verified_by_kyle: false

- id: T04
  schema: "Synthetic theorem (συνθετικὸν θεώρημα): the Peripatetic chain rule, from which the Stoics are said to have made their second, third and fourth themata."
  status: attested
  kind: synthetic_theorem
  source: "Alexander of Aphrodisias, in APr. I.25 (42b5), p. 94b, Greek quoted in Zeller, ch. V n.244"
  passage: |
    [244] Alex. on Anal. Pr. i. 25, 42, b, 5, after speaking of the Sorites,
    continues (p. 94, b): ἐν τῇ τοιαύτῃ τῶν προτάσεων συνεχείᾳ τό τε
    συνθετικόν ἐστι θεώρημα ... καὶ οἱ καλούμενοι ὑπὸ τῶν νεωτέρων
    ἐπιβάλλοντές τε καὶ ἐπιβαλλόμενοι. The συνθετικὸν θεώρημα (or
    chain-argument), the meaning of which is next investigated, must be a
    Peripatetic expression. The same meaning must attach to ἐπιβάλλοντές τε
    καὶ ἐπιβαλλόμενοι, which are to be found ἐν ταῖς συνεχῶς λαμβανομέναις
    προτάσεσι χωρὶς τῶν συμπερασμάτων· for instance, A is a property of B, B
    of C, C of D; ∴ A is a property of D. ἐπιβαλλόμενος means the inference,
    the conclusion of which is omitted; ἐπιβάλλων, the one with the omitted
    premiss. These inferences may be in either of the three Aristotelian
    figures κατὰ τὸ παραδεδομένον συνθετικὸν θεώρημα. ὃ οἱ μὲν περὶ
    Ἀριστοτέλην τῇ χρείᾳ παραμετρήσαντες παρέδοσαν, ἐφ’ ὅσον αὐτὴ ἀπῇτει, οἱ
    δὲ ἀπὸ τῆς τοῦ [στοᾶς] παρ’ ἐκείνων λαβόντες καὶ διελόντες ἐποίησαν ἐξ
    αὐτοῦ τὸ καλούμενον παρ’ αὐτοῖς δεύτερον καὶ τρίτον θέμα καὶ τέταρτον,
    ἀμελήσαντες μὲν τοῦ χρησίμου, πᾶν δὲ τὸ ὁπωσοῦν δυνάμενον λέγεσθαι ἐν τῇ
    τοιαύτῃ θεωρίᾳ κἂν ἄχρηστος ᾖ, ἐπεξελθόντες τε καὶ ζηλώσαντες.
  corpus_ref: "6a3cffd7-8e11-4dc9-92b9-9a3863d19713"
  notes: |
    Chunk 8e7bb081-9d8b-481f-b3ac-57183751efa5 holds the start of the note
    (up to "ἐν τῇ τοιαύτῃ τῶν προτάσεων συνεχείᾳ τό τε συνθετικόν ἐστι
    θεώρημα ... καὶ οἱ καλούμενοι ὑπὸ τῶν"). The passage above is from the
    overlapping next chunk. The Greek of the last sentence is untranslated in
    the corpus. It says that the Aristotelians handed the synthetic theorem
    down as far as use required, while the Stoics took it over, divided it,
    and made from it what they call the second, third and fourth thema,
    working out everything that could be said even where useless. This is
    our reading of the retrieved Greek, not a retrieved translation. It must
    be checked by Kyle or a specialist before any Phase 3 module relies on it.
    Consequence for Phase 3: themata 2 to 4 should be encoded as a family
    derived from a single chain/cut principle. The first thema has a
    different origin (contraposition, T06).
    The "..." inside the Greek is Zeller's own ellipsis.
  confidence: medium
  verified_by_kyle: false

- id: T05
  schema: "Dialectical theorem: in analysis, a conclusion validly drawn from some premises of an argument may be treated as an additional premise for later steps."
  status: reported
  kind: dialectical_theorem
  source: "Sextus Empiricus, as reported in Benson Mates, Stoic Logic (Mode 2 summary)"
  passage: |
    Sextus also reports a "dialectical theorem" (theorema) permitting analysts
    to treat any conclusion derived during analysis as if it were an
    additional premise available for subsequent steps. Mates considers it
    probable that this theorema is one of the four themata — possibly the
    second — but concedes the identification is uncertain and notes that it
    might simply be a restatement of the third.
  corpus_ref: "401a8e59-19ef-4e5e-80f0-dbeb990103a0"
  notes: |
    Also chunk acc6e721-4a81-421d-8660-5f5c496ddb95: "whenever premises
    entail a conclusion, that conclusion may be treated as implicitly present
    among the premises even if unstated." The Sextus text is not in the corpus.
    Whether the "additional premise" is added (so the premise count grows) or
    substituted matters for redundancy, and the summary cannot settle it.
  confidence: low
  verified_by_kyle: false

- id: T06
  schema: "First thema: if from two premises a conclusion follows, then from either premise together with the contradictory of the conclusion, the contradictory of the other premise follows."
  status: reported
  kind: thema
  source: "Benson Mates, Stoic Logic (Mode 2 summary); Mates's ancient source is not named in the summary"
  passage: |
    Mates describes the Stoic procedure of analysis (the reduction of complex
    arguments to sequences of basic undemonstrated arguments) and the four
    general meta-rules (themata) governing it. Of the four, only the first and
    third are directly attested. The first thema holds that if two premises
    jointly yield a conclusion, then either premise combined with the negation
    of the conclusion yields the negation of the other. The third thema holds
    that if two premises yield a conclusion, and some further propositions
    yield one of those premises, then those further propositions together
    with the other premise yield the original conclusion. The content of the
    second and fourth themata is not known, and Mates acknowledges this gap
    plainly.
  corpus_ref: "f02a4416-3430-4014-bd73-fbdb3ed20170"
  notes: |
    No ancient statement of the first thema is in the corpus (gaps.md). Note
    "negation" in the summary against "contradictory" in the ancient
    definitions of the indemonstrables (suite S002). The difference matters for
    the double negation parameter.
    The summary's statement of the third thema differs from Zeller's gloss
    (T03). Mates, as summarised, lets "further propositions" yield one of the
    premises. Zeller has the conclusion plus one further proposition yield a
    third. These are two readings to encode separately in Phase 3.
  confidence: low
  verified_by_kyle: false

